# Price Watch checker (home server). Outgoing connections only; no ports published.
# Secrets in .env: SB_URL, SB_KEY, PW_WORKER_SECRET (mode 600, never in git).
services:
  worker:
    container_name: pricewatch-worker
    build: .
    image: pricewatch-worker:local
    env_file: .env
    environment:
      BROWSER_WS: ws://browser:3000
      POLL_SECONDS: "60"
    depends_on: [browser]
    mem_limit: 256m
    restart: unless-stopped
  browser:
    container_name: pricewatch-browser
    image: docker.io/dgtlmoon/sockpuppetbrowser:latest
    cap_add: [SYS_ADMIN]
    environment:
      SCREEN_WIDTH: "1366"
      SCREEN_HEIGHT: "900"
      SCREEN_DEPTH: "16"
      MAX_CONCURRENT_CHROME_PROCESSES: "2"
    mem_limit: 1g
    restart: unless-stopped
